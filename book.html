<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Faculty Consultation - CampusSync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-role="student">
<div class="app">
  <aside class="sidebar">
    <div class="brand">CampusSync</div>
    <div class="portal">Student Portal</div>
    <nav aria-label="Main navigation">
        <a class="nav-item" href="student-dashboard.html">Dashboard</a>
        <a class="nav-item active" href="book.html" aria-current="page">Book Consultation</a>
        <a class="nav-item" href="appointments.html">My Appointments</a>
        <a class="nav-item" href="student-notifications.html">Notifications</a>
    </nav>
    <a class="nav-item" href="index.html">Logout</a>
  </aside>
  <main>
    <header class="topbar">
      <div><h1>Book a Faculty Consultation</h1><p class="muted">Choose a faculty member, a topic and a time slot.</p></div>
      <div class="user"><span><span data-user-name>Student Name</span></span><small>Student</small></div>
    </header>
    <p class="sample-note"><strong>Demo mode.</strong> Data is saved in this browser only, not on a server.</p>
    <form class="card" id="bookForm">
      <div class="form-grid">
        <div class="field">
          <label for="faculty">Faculty name</label>
          <select id="faculty" name="faculty" required></select>
        </div>
        <div class="field">
          <label for="topic">PBL consultation topic</label>
          <input id="topic" name="topic" type="text" placeholder="e.g. Project progress review" required>
        </div>
        <div class="field">
          <label for="slot">Available time slot</label>
          <select id="slot" name="slot" required><option value="">Choose a faculty first</option></select>
        </div>
        <div class="field">
          <label for="date">Consultation date</label>
          <input id="date" name="date" type="text" placeholder="Filled in when you choose a slot" readonly>
        </div>
        <div class="field wide">
          <label for="capacity">Available capacity</label>
          <input id="capacity" name="capacity" type="text" placeholder="Filled in when you choose a slot" readonly>
        </div>
        <div class="field wide">
          <label for="desc">Description of the discussion (optional)</label>
          <textarea id="desc" name="desc" placeholder="Briefly describe what you want to discuss"></textarea>
        </div>
      </div>
      <p id="formMsg" class="form-msg" role="alert"></p>
      <div class="form-actions">
        <button type="submit" class="btn primary">Book Consultation</button>
        <a class="btn" href="student-dashboard.html">Back to Dashboard</a>
      </div>
    </form>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
