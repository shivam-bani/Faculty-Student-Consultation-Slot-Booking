<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - CampusSync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-hero">
    <h1>CampusSync</h1>
    <p>Faculty–Student Consultation Slot Booking</p>
    <small>Connect &nbsp;•&nbsp; Collaborate &nbsp;•&nbsp; Grow</small>
  </section>
  <form class="auth-card" id="loginForm">
    <h2>Login</h2>
    <p class="muted">Sign in to your account</p>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@college.edu" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" required>
    </div>
    <p id="formMsg" class="form-msg" role="alert"></p>
    <button type="submit" value="student" class="btn primary full">Login as Student</button>
    <button type="submit" value="faculty" class="btn dark full">Login as Faculty</button>
    <button type="submit" value="admin" class="btn full">Login as Admin</button>
    <p class="auth-link">Student without an account? <a href="signup.html">Sign Up</a></p>
    <p class="muted center">Faculty accounts are created by the admin.</p>
    <button type="button" id="resetData" class="linkish center">Reset all data saved in this browser</button>
  </form>
</main>
<script src="script.js"></script>
</body>
</html>
