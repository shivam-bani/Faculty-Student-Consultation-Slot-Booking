<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - CampusSync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-role="student">
<div class="app">
  <aside class="sidebar">
    <div class="brand">CampusSync</div>
    <div class="portal">Student Portal</div>
    <nav aria-label="Main navigation">
        <a class="nav-item active" href="student-dashboard.html" aria-current="page">Dashboard</a>
        <a class="nav-item" href="slots.html">Available Slots</a>
        <a class="nav-item" href="book.html">Book Consultation</a>
        <a class="nav-item" href="appointments.html">My Appointments</a>
        <a class="nav-item" href="student-calendar.html">Calendar</a>
        <a class="nav-item" href="student-notifications.html">Notifications</a>
    </nav>
    <a class="nav-item" href="index.html">Logout</a>
  </aside>
  <main>
    <header class="topbar">
      <div><h1>Welcome, <span data-user-name>Student Name</span>!</h1><p class="muted">Here is an overview of your consultations.</p></div>
      <div class="user"><span><span data-user-name>Student Name</span></span><small>Student</small></div>
    </header>
    <section class="card">
      <div class="card-head"><h2>My Appointments</h2><div class="actions"><a class="btn primary small" href="slots.html">Find a slot</a><a class="btn small" href="appointments.html">View all</a></div></div>
      <div class="table-wrap">
        <table class="responsive">
          <caption class="sr-only">My appointments</caption>
          <thead><tr><th scope="col">Token</th><th scope="col">Faculty</th><th scope="col">Topic</th><th scope="col">Date</th><th scope="col">Time</th><th scope="col">Status</th></tr></thead>
          <tbody id="myAppts"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src="timetable-data.js"></script>
<script src="script.js"></script>
</body>
</html>
