<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar - CampusSync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-role="student">
<div class="app">
  <aside class="sidebar">
    <div class="brand">CampusSync</div>
    <div class="portal">Student Portal</div>
    <nav aria-label="Main navigation">
        <a class="nav-item" href="student-dashboard.html">Dashboard</a>
        <a class="nav-item" href="slots.html">Available Slots</a>
        <a class="nav-item" href="book.html">Book Consultation</a>
        <a class="nav-item" href="appointments.html">My Appointments</a>
        <a class="nav-item active" href="student-calendar.html" aria-current="page">Calendar</a>
        <a class="nav-item" href="student-notifications.html">Notifications</a>
    </nav>
    <a class="nav-item" href="index.html">Logout</a>
  </aside>
  <main>
    <header class="topbar">
      <div><h1>Calendar</h1><p class="muted">Your consultation meetings by date.</p></div>
      <div class="user"><span><span data-user-name>Student Name</span></span><small>Student</small></div>
    </header>
    <section class="card">
      <div class="cal-bar">
        <button type="button" id="calPrev" class="btn small">&larr; Previous</button>
        <h2 id="calTitle">Month</h2>
        <button type="button" id="calNext" class="btn small">Next &rarr;</button>
      </div>
      <div id="calGrid" class="calendar"></div>
      <p class="muted cal-hint">Select a date to see only that day's meetings.</p>
    </section>
    <section class="card">
      <h2 id="calListTitle">Meetings this month</h2>
      <ul id="calList" class="cal-list"></ul>
    </section>
  </main>
</div>
<script src="timetable-data.js"></script>
<script src="script.js"></script>
</body>
</html>
