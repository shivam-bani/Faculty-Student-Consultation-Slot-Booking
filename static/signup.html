<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - CampusSync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-hero">
    <h1>CampusSync</h1>
    <p>Faculty–Student Consultation Slot Booking</p>
    <small>Create your account to get started</small>
  </section>
  <form class="auth-card" id="signupForm">
    <h2>Create an account</h2>
    <p class="muted">Create your student account.</p>
    <div>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" placeholder="Your full name" required>
    </div>
    <div>
      <label for="email">College email</label>
      <input id="email" name="email" type="email" placeholder="you@college.edu" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required>
    </div>
    <div>
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" minlength="8" placeholder="Re-enter your password" required>
    </div>
    <p class="muted">Faculty accounts are created by the admin, so faculty do not need to sign up.</p>
    <p id="formMsg" class="form-msg" role="alert"></p>
    <button type="submit" class="btn primary full">Register</button>
    <p class="auth-link">Already have an account? <a href="index.html">Back to Login</a></p>
  </form>
</main>
<script src="timetable-data.js"></script>
<script src="script.js"></script>
</body>
</html>
