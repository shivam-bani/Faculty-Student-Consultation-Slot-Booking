<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a Consultation Session - CampusSync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-role="faculty">
<div class="app">
  <aside class="sidebar">
    <div class="brand">CampusSync</div>
    <div class="portal">Faculty Portal</div>
    <nav aria-label="Main navigation">
        <a class="nav-item" href="faculty-dashboard.html">Dashboard</a>
        <a class="nav-item active" href="create-session.html" aria-current="page">Create Session</a>
        <a class="nav-item" href="queue.html">Waiting Queue</a>
        <a class="nav-item" href="faculty-notifications.html">Notifications</a>
    </nav>
    <a class="nav-item" href="index.html">Logout</a>
  </aside>
  <main>
    <header class="topbar">
      <div><h1>Create a Consultation Session</h1><p class="muted">Set the topic, time and capacity for students.</p></div>
      <div class="user"><span><span data-user-name>Faculty Name</span></span><small>Faculty</small></div>
    </header>
    <p class="sample-note"><strong>Demo mode.</strong> Data is saved in this browser only, not on a server.</p>
    <form class="card" id="sessionForm">
      <div class="form-grid">
        <div class="field wide">
          <label for="topic">Consultation topic</label>
          <input id="topic" name="topic" type="text" placeholder="e.g. PBL Project Review" required>
        </div>
        <div class="field wide">
          <label for="desc">PBL project or discussion description</label>
          <textarea id="desc" name="desc" placeholder="Describe what students can discuss in this session" required></textarea>
        </div>
        <div class="field">
          <label for="date">Consultation date</label>
          <input id="date" name="date" type="date" required>
        </div>
        <div class="field">
          <label for="capacity">Maximum student capacity</label>
          <input id="capacity" name="capacity" type="number" min="1" max="50" placeholder="e.g. 5" required>
        </div>
        <div class="field">
          <label for="start">Start time</label>
          <input id="start" name="start" type="time" required>
        </div>
        <div class="field">
          <label for="end">End time</label>
          <input id="end" name="end" type="time" required>
        </div>
      </div>
      <p id="formMsg" class="form-msg" role="alert"></p>
      <div class="form-actions">
        <button type="submit" class="btn primary">Create Session</button>
        <a class="btn" href="faculty-dashboard.html">Back to Dashboard</a>
      </div>
    </form>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
